<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00"/>
      <stop offset="100%" stop-color="#FCD116"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003893"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Escudo / Insignia de mapa estilizado -->
  <g transform="translate(10, 10)" filter="url(#shadow)">
    <!-- Bandera tricolor curvada -->
    <rect x="0" y="0" width="100" height="48" rx="8" fill="#FCD116"/>
    <rect x="0" y="48" width="100" height="26" fill="#003893"/>
    <rect x="0" y="74" width="100" height="26" rx="8" fill="#CE1126"/>
    <!-- Brillo y borde -->
    <rect x="0" y="0" width="100" height="100" rx="16" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>
    
    <!-- Ícono central de pregunta -->
    <circle cx="50" cy="50" r="26" fill="#FFFFFF" opacity="0.95"/>
    <text x="50" y="60" font-family="'Montserrat', 'Poppins', sans-serif" font-size="32" font-weight="900" fill="#003893" text-anchor="middle">?</text>
  </g>

  <!-- Tipografía del Título -->
  <g transform="translate(130, 25)">
    <text x="0" y="42" font-family="'Montserrat', 'Poppins', sans-serif" font-size="44" font-weight="900" fill="url(#blueGrad)" letter-spacing="-1">TRIVIA</text>
    <text x="165" y="42" font-family="'Montserrat', 'Poppins', sans-serif" font-size="44" font-weight="900" fill="#CE1126" letter-spacing="-1">COLOMBIA</text>
    
    <!-- Subtítulo -->
    <text x="2" y="72" font-family="'Poppins', sans-serif" font-size="16" font-weight="600" fill="#64748B" letter-spacing="3">JUEGO DE PREGUNTAS</text>
    
    <!-- Acento gráfico tricolor -->
    <rect x="2" y="82" width="60" height="4" rx="2" fill="#FCD116"/>
    <rect x="66" y="82" width="30" height="4" rx="2" fill="#003893"/>
    <rect x="100" y="82" width="30" height="4" rx="2" fill="#CE1126"/>
  </g>
</svg>
